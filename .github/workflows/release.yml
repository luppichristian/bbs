name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            asset_name: bbs-windows-x86_64.zip
            cmake_args: -A x64
          - platform: windows-x86
            runner: windows-latest
            asset_name: bbs-windows-x86.zip
            cmake_args: -A Win32
          - platform: windows-arm64
            runner: windows-latest
            asset_name: bbs-windows-arm64.zip
            cmake_args: -A ARM64
          - platform: linux-x86_64
            runner: ubuntu-latest
            asset_name: bbs-linux-x86_64.tar.gz
            cmake_args: ''
          - platform: linux-x86
            runner: ubuntu-latest
            asset_name: bbs-linux-x86.tar.gz
            cmake_args: -DCMAKE_C_FLAGS=-m32
          - platform: linux-arm64
            runner: ubuntu-latest
            asset_name: bbs-linux-arm64.tar.gz
            cmake_args: -DCMAKE_TOOLCHAIN_FILE=cmake/linux-arm64-toolchain.cmake
          - platform: macos-x86_64
            runner: macos-13
            asset_name: bbs-macos-x86_64.tar.gz
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - platform: macos-arm64
            runner: macos-13
            asset_name: bbs-macos-arm64.tar.gz
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux cross-build dependencies
        if: runner.os == 'Linux' && matrix.platform == 'linux-x86'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Install Linux ARM64 cross compiler
        if: runner.os == 'Linux' && matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Write Linux ARM64 toolchain file
        if: runner.os == 'Linux' && matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          mkdir -p cmake
          cat <<'EOF' > cmake/linux-arm64-toolchain.cmake
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          EOF

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $args = @('-S', '.', '-B', 'build/release', '-DCMAKE_BUILD_TYPE=Release')
          if ('${{ matrix.cmake_args }}') {
            $args += '${{ matrix.cmake_args }}'.Split(' ')
          }
          cmake @args

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build/release --config Release

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build/release --config Release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Remove-Item -Recurse -Force stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item build/release/bbs.exe stage/bbs.exe
          Copy-Item LICENSE.md stage/LICENSE.md
          Compress-Archive -LiteralPath stage/* -DestinationPath package/${{ matrix.asset_name }} -Force

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package
          rm -rf stage
          mkdir -p stage
          cp build/release/bbs stage/bbs
          cp LICENSE.md stage/LICENSE.md
          chmod +x stage/bbs
          tar -czf package/${{ matrix.asset_name }} -C stage .

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: package/${{ matrix.asset_name }}

  release:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release-assets/*

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tester:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ubuntu system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Build bbs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/ci-bbs
          cmake --build build/ci-bbs --config Release

      - name: Build bbs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/ci-bbs
          cmake --build build/ci-bbs --config Release

      - name: Run isolated tester (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tester/run.py --bbs build/ci-bbs/bbs.exe --show-log-paths

      - name: Run isolated tester (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python tester/run.py --bbs build/ci-bbs/bbs --show-log-paths

      - name: Upload tester logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tester-artifacts-${{ matrix.os }}
          path: tester/.artifacts/
          include-hidden-files: true
          if-no-files-found: warn

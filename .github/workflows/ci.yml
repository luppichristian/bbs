name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tester:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ubuntu system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libglfw3 \
            libglfw3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxrender-dev \
            zip

      - name: Build bbs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/ci-bbs
          cmake --build build/ci-bbs --config Release

      - name: Build bbs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/ci-bbs
          cmake --build build/ci-bbs --config Release

      - name: Run isolated tester (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tester/run.py --bbs build/ci-bbs/bbs.exe --show-log-paths

      - name: Run isolated tester (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          python tester/run.py --bbs build/ci-bbs/bbs --show-log-paths 2>&1 | tee tester-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            fail_line=$(awk 'f && /^  - / {print; exit} /^FAIL$/ {f=1}' tester-output.log || true)
            if [ -z "$fail_line" ]; then
              fail_line=$(grep '^\[FAIL\]' tester-output.log | tail -n 1 || true)
            fi
            if [ -n "$fail_line" ]; then
              echo "::error title=isolated tester failure::$fail_line"
            fi

            fail_log=$(printf '%s\n' "$fail_line" | sed -n 's/.*See \(.*\)$/\1/p')
            if [ -n "$fail_log" ] && [ -f "$fail_log" ]; then
              echo "::group::failing tester log"
              tail -n 200 "$fail_log"
              echo "::endgroup::"

              fail_summary=$(tail -n 40 "$fail_log" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-180)
              if [ -n "$fail_summary" ]; then
                echo "::error title=failing tester log tail::$fail_summary"
              fi
            fi

            exit "$status"
          fi

      - name: Upload tester logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tester-artifacts-${{ matrix.os }}
          path: tester/.artifacts/
          include-hidden-files: true
          if-no-files-found: warn

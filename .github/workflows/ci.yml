name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tester:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build bbs
        shell: pwsh
        run: |
          cmake -S . -B build/ci-bbs
          cmake --build build/ci-bbs --config Release

      - name: Run isolated tester
        shell: pwsh
        run: |
          python tester/run.py --bbs build/ci-bbs/bbs.exe --show-log-paths

      - name: Upload tester logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tester-artifacts-windows-latest
          path: tester/.artifacts/
          include-hidden-files: true
          if-no-files-found: warn

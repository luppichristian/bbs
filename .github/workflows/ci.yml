name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  example:
    name: ${{ matrix.platform }} / ${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - default
          - debug
        include:
          - runner: windows-latest
            platform: windows-x86_64
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: macos-13
            platform: macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Build bbs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/ci-bbs
          cmake --build build/ci-bbs --config Release

      - name: Build bbs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/ci-bbs
          cmake --build build/ci-bbs --config Release

      - name: Generate example workflow (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: examples/hello_world
        run: |
          ../../build/ci-bbs/bbs.exe gen github --override

      - name: Generate example workflow (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: examples/hello_world
        run: |
          ../../build/ci-bbs/bbs gen github --override

      - name: Init example toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: examples/hello_world
        run: |
          ../../build/ci-bbs/bbs.exe update --init-toolchain

      - name: Init example toolchain (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: examples/hello_world
        run: |
          ../../build/ci-bbs/bbs update --init-toolchain

      - name: Build example (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: examples/hello_world
        run: |
          ../../build/ci-bbs/bbs.exe build -t * -p ${{ matrix.platform }} -c ${{ matrix.config }}

      - name: Build example (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: examples/hello_world
        run: |
          ../../build/ci-bbs/bbs build -t * -p ${{ matrix.platform }} -c ${{ matrix.config }}

      - name: Test example (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: examples/hello_world
        run: |
          ../../build/ci-bbs/bbs.exe test -t * -p ${{ matrix.platform }} -c ${{ matrix.config }}

      - name: Test example (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: examples/hello_world
        run: |
          ../../build/ci-bbs/bbs test -t * -p ${{ matrix.platform }} -c ${{ matrix.config }}

      - name: Run example (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: examples/hello_world
        run: |
          ../../build/ci-bbs/bbs.exe run -t * -p * -c ${{ matrix.config }}

      - name: Run example (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: examples/hello_world
        run: |
          ../../build/ci-bbs/bbs run -t * -p * -c ${{ matrix.config }}

      - name: Dist example (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: examples/hello_world
        run: |
          ../../build/ci-bbs/bbs.exe dist -t * -p ${{ matrix.platform }} -c ${{ matrix.config }}

      - name: Dist example (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: examples/hello_world
        run: |
          ../../build/ci-bbs/bbs dist -t * -p ${{ matrix.platform }} -c ${{ matrix.config }}

      - name: Upload example dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hello_world-dist-${{ matrix.platform }}-${{ matrix.config }}
          path: examples/hello_world/dist/${{ matrix.config }}-${{ matrix.platform }}
